# Render Blueprint: PostgreSQL + FastAPI backend.
# The frontend is deployed separately on Vercel (root directory: frontend).
databases:
  - name: courtly-db
    plan: free
    databaseName: reservations
    user: reservations

services:
  - type: web
    name: courtly-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # seed.py migrates the schema to head, then (idempotently) adds demo data.
    startCommand: .venv/bin/python -m reservations.seed && .venv/bin/fastapi run src/reservations/main.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: courtly-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: LOG_FORMAT
        value: json
